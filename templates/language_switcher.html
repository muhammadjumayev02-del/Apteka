{% load i18n %}{% get_current_language as LANGUAGE_CODE %}
<form class="language-switcher" action="{% url 'set_language' %}" method="post">
  {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="uz" lang="uz" aria-pressed="{% if LANGUAGE_CODE == 'uz' %}true{% else %}false{% endif %}">O‘zbekcha</button>
  <span aria-hidden="true">|</span>
  <button type="submit" name="language" value="ru" lang="ru" aria-pressed="{% if LANGUAGE_CODE == 'ru' %}true{% else %}false{% endif %}">Русский</button>
</form>
